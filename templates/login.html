{% extends "base.html" %}

{% block title %}CATALYST{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Account <span class="gradient-text">Login</span></h1>
      <p class="auth-subtitle">Access your CATALYST placement readiness portal</p>
    </div>

    <!-- Login Type Tabs -->
    <div class="login-tabs" style="display:flex; border-bottom: 2px solid var(--border-color, #e5e7eb); margin-bottom: 24px;">
      <button type="button" id="tab-student" onclick="switchTab('student')"
        style="flex:1; padding:10px 0; background:none; border:none; cursor:pointer; font-size:0.97rem; font-weight:600; color:var(--accent-primary); border-bottom: 3px solid var(--accent-primary); margin-bottom:-2px; transition: all 0.2s;">
        Student Login
      </button>
      <button type="button" id="tab-admin" onclick="switchTab('admin')"
        style="flex:1; padding:10px 0; background:none; border:none; cursor:pointer; font-size:0.97rem; font-weight:600; color:var(--text-muted); border-bottom: 3px solid transparent; margin-bottom:-2px; transition: all 0.2s;">
        Admin Login
      </button>
    </div>

    <!-- Student Login Form -->
    <form id="form-student-login" action="{{ url_for('login') }}" method="POST" novalidate>
      <input type="hidden" name="login_type" value="student">
      <div class="form-group">
        <label for="student_identifier" class="form-label">Username, PRN, or Email</label>
        <input 
          type="text" 
          id="student_identifier" 
          name="identifier" 
          class="form-control" 
          placeholder="Enter your Username, PRN, or Email"
        >
        <div class="field-error" id="err-student-identifier" style="display:none; color:#f87171; font-size:0.83rem; margin-top:4px;"></div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="student_password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="#" onclick="alert('Please contact your College Placement Coordinator or Administrator to reset your password.'); return false;" style="font-size: 0.85rem; color: var(--accent-primary);">Forgot Password?</a>
        </div>
        <div class="password-wrapper" style="position:relative;">
          <input 
            type="password" 
            id="student_password" 
            name="password" 
            class="form-control" 
            placeholder=""
          >
          <button type="button" class="pwd-toggle" onclick="togglePassword('student_password', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div class="field-error" id="err-student-password" style="display:none; color:#f87171; font-size:0.83rem; margin-top:4px;"></div>
      </div>

      <button type="button" class="btn btn-primary btn-full" onclick="validateAndSubmitStudent()">
        Login to CATALYST &rarr;
      </button>

      <div class="form-footer">
        New student? <a href="{{ url_for('register') }}">Register your account here</a>
      </div>
    </form>

    <!-- Admin Login Form -->
    <form id="form-admin-login" action="{{ url_for('login') }}" method="POST" novalidate style="display:none;">
      <input type="hidden" name="login_type" value="admin">
      <div class="form-group">
        <label for="admin_username" class="form-label">Admin Username</label>
        <div style="display:flex; align-items:center; gap:0;">
          <span style="background: var(--bg-input, #f3f4f6); border: 1px solid var(--border-color, #d1d5db); border-right:none; border-radius: 8px 0 0 8px; padding: 10px 14px; font-size:0.97rem; font-weight:600; color:var(--text-muted); white-space:nowrap; line-height:1.5;">TPC</span>
          <input 
            type="text" 
            id="admin_username_suffix" 
            name="admin_username_suffix"
            class="form-control" 
            placeholder=""
            maxlength="3"
            style="border-radius: 0 8px 8px 0; border-left:none;"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
          >
        </div>
        <div class="field-error" id="err-admin-identifier" style="display:none; color:#f87171; font-size:0.83rem; margin-top:4px;"></div>
      </div>

      <div class="form-group">
        <label for="admin_password" class="form-label">Password</label>
        <div class="password-wrapper" style="position:relative;">
          <input 
            type="password" 
            id="admin_password" 
            name="password" 
            class="form-control" 
            placeholder=""
            maxlength="4"
          >
          <button type="button" class="pwd-toggle" onclick="togglePassword('admin_password', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div class="field-error" id="err-admin-password" style="display:none; color:#f87171; font-size:0.83rem; margin-top:4px;"></div>
      </div>

      <button type="button" class="btn btn-primary btn-full" onclick="validateAndSubmitAdmin()">
        Admin Login &rarr;
      </button>
    </form>

  </div>
</div>

<script>
function switchTab(tab) {
  const studentForm = document.getElementById('form-student-login');
  const adminForm = document.getElementById('form-admin-login');
  const tabStudent = document.getElementById('tab-student');
  const tabAdmin = document.getElementById('tab-admin');

  if (tab === 'student') {
    studentForm.style.display = 'block';
    adminForm.style.display = 'none';
    tabStudent.style.color = 'var(--accent-primary)';
    tabStudent.style.borderBottomColor = 'var(--accent-primary)';
    tabAdmin.style.color = 'var(--text-muted)';
    tabAdmin.style.borderBottomColor = 'transparent';
  } else {
    studentForm.style.display = 'none';
    adminForm.style.display = 'block';
    tabAdmin.style.color = 'var(--accent-primary)';
    tabAdmin.style.borderBottomColor = 'var(--accent-primary)';
    tabStudent.style.color = 'var(--text-muted)';
    tabStudent.style.borderBottomColor = 'transparent';
  }
}

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  const icon = btn.querySelector('.eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
}

function validateAndSubmitStudent() {
  const idErr = document.getElementById('err-student-identifier');
  const pwErr = document.getElementById('err-student-password');
  idErr.style.display = 'none';
  pwErr.style.display = 'none';
  document.getElementById('student_identifier').style.borderColor = '';
  document.getElementById('student_password').style.borderColor = '';

  const identifier = document.getElementById('student_identifier').value.trim();
  const password = document.getElementById('student_password').value;
  let valid = true;

  if (!identifier) {
    idErr.textContent = 'Please enter your username, PRN, or email address.';
    idErr.style.display = 'block';
    document.getElementById('student_identifier').style.borderColor = '#f87171';
    valid = false;
  }
  if (!password) {
    pwErr.textContent = 'Please enter your password.';
    pwErr.style.display = 'block';
    document.getElementById('student_password').style.borderColor = '#f87171';
    valid = false;
  }
  if (valid) document.getElementById('form-student-login').submit();
}

function validateAndSubmitAdmin() {
  const idErr = document.getElementById('err-admin-identifier');
  const pwErr = document.getElementById('err-admin-password');
  idErr.style.display = 'none';
  pwErr.style.display = 'none';
  document.getElementById('admin_username_suffix').style.borderColor = '';
  document.getElementById('admin_password').style.borderColor = '';

  const suffix = document.getElementById('admin_username_suffix').value.trim();
  const password = document.getElementById('admin_password').value;
  let valid = true;

  if (!suffix || suffix.length !== 3) {
    idErr.textContent = 'Please enter the 3-digit admin code after TPC.';
    idErr.style.display = 'block';
    document.getElementById('admin_username_suffix').style.borderColor = '#f87171';
    valid = false;
  }
  if (!password || password.length !== 4) {
    pwErr.textContent = 'Please enter your 4-digit password.';
    pwErr.style.display = 'block';
    document.getElementById('admin_password').style.borderColor = '#f87171';
    valid = false;
  }

  if (valid) {
    // Set the combined username into a hidden field
    const hiddenInput = document.createElement('input');
    hiddenInput.type = 'hidden';
    hiddenInput.name = 'identifier';
    hiddenInput.value = 'TPC' + suffix;
    document.getElementById('form-admin-login').appendChild(hiddenInput);
    document.getElementById('form-admin-login').submit();
  }
}
</script>
{% endblock %}
